description = "Grok (xAI) Image Describer for ComfyUI - Generate rich I2V prompts with human-in-the-loop review"
version = "1.0.1"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0.0",
    "Pillow>=10.0.0",
    "numpy>=1.21.0",
]

[project.urls]
Repository = "https://github.com/YOUR_USERNAME/comfyui-grok-describe"

[tool.comfy]
publisher = "YOUR_GITHUB_USERNAME"
display_name = "Grok Image Describer"
icon = "🔥"
category = "API / LLM"
tags = ["grok", "xai", "vision", "i2v", "prompt", "wan", "image-to-video"]